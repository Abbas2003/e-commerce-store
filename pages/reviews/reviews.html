<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product review</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<style>
     /* review Notification Style */
     .review-notification {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background-color: rgba(10, 64, 91, 0.8); /* Green background */
        color: white;
        padding: 10px 20px;
        border-radius: 5px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s, visibility 0.3s;
        z-index: 1000;
    }



</style>
<body class="bg-gray-100">

    <!-- Navbar -->
    <nav class="bg-white shadow-md">
        <div class="container mx-auto px-6 py-3 flex justify-between items-center">
            <!-- Logo -->
            <div class="text-2xl tracking-wide font-semibold">
                <a href="../../index.html" class="text-gray-800 font-serif">SastaBazar</a>
            </div>

            <!-- Hamburger Icon -->
            <div class="lg:hidden flex items-center">
                <button id="menu-button" class="text-gray-600 hover:text-gray-800 focus:outline-none">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
            </div>

            <!-- Navbar Links -->
            <div id="menu" class="hidden lg:flex lg:items-center lg:space-x-4">
                <a href="../../index.html" class="text-gray-600 hover:text-gray-800">Home</a>
                <a href="#" class="text-gray-600 hover:text-gray-800 flex items-center ">
                    Dashboard
                </a>
                <a id="uploadLink" href="./pages/productupload/productupload.html" class="text-gray-600 hidden hover:text-gray-800">Upload Product</a>
                <a id="productsLink" href="../productupload/products/products.html" class="text-gray-600 hover:text-gray-800">Products</a>
                <a href="#" class="text-gray-600 hover:text-gray-800">Orders</a>
                <button onclick="logout()" id="logoutBtn" class="text-white bg-blue-500 p-2 rounded hidden">Logout</button>
            </div>
        </div>

        <!-- Mobile Menu -->
        <div id="mobile-menu" class="lg:hidden bg-white shadow-md mt-2 grid justify-items-center">
            <a href="../../index.html" class="block text-gray-600 hover:text-gray-800 px-4 py-2">Home</a>
            <a href="../../index.html" class="block text-gray-600 hover:text-gray-800 px-4 py-2">Dashboard</a>
            <a id="uploadLinkMobile" href="../productupload/productupload.html" class="block text-gray-600 hover:text-gray-800 px-4 py-2">Upload Product</a>
            <a id="productsLinkMobile" href="../productupload/products/products.html" class="text-gray-600 hover:text-gray-800 px-4 py-2">Products</a>
            <a href="#" class="block text-gray-600 hover:text-gray-800 px-4 py-2">Orders</a>
            <button onclick="logout()" id="logoutBtnMobile" class="block text-white bg-blue-500 p-2 rounded mx-4 my-2 hidden">Logout</button>
        </div>
    </nav>


      
    <!-- Main Content -->
    <main class="container mx-auto px-6 py-10">
        <div class="bg-white shadow-md rounded-lg p-8 max-w-2xl mx-auto">
            <h2 class="text-xl md:text-3xl lg:text-3xl  font-bold mb-6 text-center">Product Description & Reviews</h2>

                <!-- Product Description -->
                <section id="product-description" class="mb-8">
                    
                </section>

                <!-- Reviews Section -->
                <section id="reviews" class="mb-8">
                    <h2 class="text-2xl font-bold text-center mb-4 md:text-3xl md:font-extrabold">Customer Reviews</h2>
                    <div id="review-list">
                        <!-- Reviews will be inserted here by JavaScript -->
                    </div>
                </section>

                <!-- Review Form -->
                <section id="review-form">
                    <h2 class="text-2xl font-bold mb-4">Write a Review</h2>
                    <form id="add-review-form" class="space-y-4">
                        <div>
                            <label for="reviewer-name" class="block text-gray-700 font-semibold">Your Name:</label>
                            <input type="text" id="reviewer-name" class="w-full p-2 border border-gray-300 rounded mt-1" required>
                        </div>
                        <div>
                            <label for="review-text" class="block text-gray-700 font-semibold">Your Review:</label>
                            <textarea id="review-text" class="w-full p-2 border border-gray-300 rounded mt-1" rows="4" required></textarea>
                        </div>
                        <button type="submit"  class="bg-blue-600 text-white py-2 px-4 rounded hover:bg-blue-700">Submit Review</button>
                    </form>
                </section>

                 <!-- review Notification -->
                <div id="review-notification" class="review-notification">
                    Your review has been added.
                    <p>
                        Thank you!
                    </p>
                </div>
        </div>
    </main>

    
    <script type="module" src="./reviews.js"></script>
</body>
</html>
